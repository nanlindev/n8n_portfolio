include:
  - path: ../../platform-n8n/docker/templates/networks.yml

services:
  rss_python_ai:
    extends:
      file: ../../platform-n8n/docker/templates/python-sidecar.base.yml
      service: python_sidecar_template
    env_file:
      - ../.env
    build:
      context: ../python-service
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: ghcr.io/nanlindev/n8n_portfolio/python-ai-service:latest
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LANGFUSE_TRACING_ENVIRONMENT: ${ENVIRONMENT:-development}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: n8n-rss-ai-service
      OTEL_SERVICE_VERSION: v2.0
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${ENVIRONMENT:-development},service.name=n8n-rss-ai-service,gen_ai.system=deepseek,tags=rss-filter,langfuse.tags=rss-filter
    ports:
      - "8001:8001"
