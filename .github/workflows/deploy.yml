name: Deploy to Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    uses: nanlindev/platform-n8n/.github/workflows/reusable-deploy-python.yml@main
    with:
      python_image_name: ghcr.io/nanlindev/n8n_portfolio/python-ai-service
      deploy_path: /home/deploy/projects/n8n_portfolio
      compose_file: docker/compose.yml
      build_context: ./python-service
      dockerfile: python-service/Dockerfile
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
